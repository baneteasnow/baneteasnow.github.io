---
layout: page-16
title: Search
published: true
permalink: /search.html
---

<div
	class="book-search"
	id="bookSearch"
>
	<div class="search-box">
		<input
			type="search"
			id="bookSearchInput"
			placeholder="Search by book title or author..."
			autocomplete="off"
			aria-label="Search books"
		/>
	</div>

	<fieldset
		class="category-choice"
		aria-label="Category display"
	>
		<label
			><input
				type="radio"
				name="searchCategories"
				value="without"
				checked
			/>
			Without categories</label
		>
		<label
			><input
				type="radio"
				name="searchCategories"
				value="with"
			/>
			With categories</label
		>
	</fieldset>

	<fieldset class="cover-choice" aria-label="Book cover display">
		<label><input type="radio" name="searchCovers" value="without" checked /> Without covers</label>
		<label><input type="radio" name="searchCovers" value="with" /> With covers</label>
	</fieldset>

	<p
		class="search-help"
		id="searchHelp"
	>
		Search for a book or author, or click
		<button
			type="button"
			id="showAllButton"
			class="search-toggle"
		>
			Show All</button
		>.
	</p>

	<div
		id="searchStatus"
		class="search-status"
		aria-live="polite"
	></div>

	<div
		id="searchResults"
		class="search-results"
	></div>
</div>

<style>

		background: transparent !important;
		box-shadow: none !important;
		color: #444444 !important;
		font-family: inherit;
		font-size: inherit !important;

		text-decoration: underline;

	/* Book title */

	/* Mobile */

	@media (max-width: 430px) {

		body:has(#bookSearch) .w {

		.book-search #bookSearchInput,

		.book-search .search-meta {

	/* Prevent horizontal overflow on Search */

	@media (max-width: 600px) {
		body:has(#bookSearch) .w {
			display: block !important;

			max-width: 100% !important;
			min-width: 0 !important;
			margin-left: auto !important;
			margin-right: auto !important;
			padding-left: 20px !important;
			padding-right: 20px !important;
			box-sizing: border-box !important;
		}
	}

/* Next52books · Warm Editorial — visual styles only */
.book-search .search-title { font-family: "EB Garamond", Georgia, serif; font-size: 18px; font-weight: 600; color: #292724; line-height: 1.35; }
.book-search .search-turkish { font-family: "EB Garamond", Georgia, serif; font-size: 14px; color: #77716C; }
.book-search .search-author { font-family: "EB Garamond", Georgia, serif; font-size: 15px; color: #77716C; }
.book-search .search-author-link:hover { color: #9A8878; }
.book-search .search-date { font-family: "EB Garamond", Georgia, serif; font-size: 12px; color: #77716C; }
.book-search .search-item { border-bottom-color: #E8E4DF; }
.book-search .search-status, .book-search .search-help,
.book-search .category-choice, .book-search .cover-choice { font-family: "DM Sans", sans-serif; font-size: 12px; color: #77716C; }
.book-search .category-choice input, .book-search .cover-choice input { accent-color: #9A8878; }
.book-search .search-category { color: #77716C; }
.book-search #bookSearchInput { color: #292724; border-color: #E8E4DF; }
.book-search #bookSearchInput:focus { border-color: #9A8878; }
.book-search .search-toggle { color: #292724 !important; }
.book-search .search-toggle:hover { color: #9A8878 !important; }

</style>

<script>
	;(function () {
		"use strict"

		const input = document.getElementById("bookSearchInput")
		const resultsContainer = document.getElementById("searchResults")
		const status = document.getElementById("searchStatus")
		const showAllButton = document.getElementById("showAllButton")

		let books = []
		let searchTimer = null
		let isLoaded = false
		let showAll = false
		let showCategories = false
		let showCovers = false

		/*
		 * Normalize Turkish characters and accents.
		 */

		function normalizeText(value) {
			return String(value || "")
				.toLocaleLowerCase("tr-TR")
				.replace(/ı/g, "i")
				.replace(/ç/g, "c")
				.replace(/ğ/g, "g")
				.replace(/ö/g, "o")
				.replace(/ş/g, "s")
				.replace(/ü/g, "u")
				.normalize("NFD")
				.replace(/[\u0300-\u036f]/g, "")
		}

		/*
		 * Date formatting
		 */

		function formatDate(value) {
			if (!value) return ""

			const parts = value.split("-")

			if (parts.length !== 3) return value

			const date = new Date(
				Number(parts[0]),
				Number(parts[1]) - 1,
				Number(parts[2]),
			)

			if (Number.isNaN(date.getTime())) {
				return value
			}

			return date.toLocaleDateString("en-GB", {
				day: "2-digit",
				month: "short",
				year: "numeric",
			})
		}

		/*
		 * Highlight matching text.
		 *
		 * This method compares normalized characters while
		 * preserving the original spelling in the displayed text.
		 *
		 * It uses DOM text nodes rather than inserting raw HTML.
		 */

		function appendHighlightedText(element, value, query) {
			const original = String(value || "")
			const normalizedQuery = normalizeText(query).trim()

			if (!original || !normalizedQuery) {
				element.textContent = original
				return
			}

			const terms = normalizedQuery.split(/\s+/).filter(Boolean)

			if (terms.length === 0) {
				element.textContent = original
				return
			}

			/*
			 * Build a normalized string and map its characters
			 * back to positions in the original string.
			 */

			let normalized = ""
			const positions = []

			for (let i = 0; i < original.length; i++) {
				const character = original[i]
				const converted = normalizeText(character)

				for (let j = 0; j < converted.length; j++) {
					normalized += converted[j]
					positions.push(i)
				}
			}

			const highlighted = new Array(original.length).fill(false)

			terms.forEach(function (term) {
				let searchFrom = 0

				while (searchFrom < normalized.length) {
					const matchIndex = normalized.indexOf(term, searchFrom)

					if (matchIndex === -1) break

					const start = positions[matchIndex]
					const end = positions[matchIndex + term.length - 1]

					if (start !== undefined && end !== undefined) {
						for (let i = start; i <= end; i++) {
							highlighted[i] = true
						}
					}

					searchFrom = matchIndex + term.length
				}
			})

			let position = 0

			while (position < original.length) {
				const shouldHighlight = highlighted[position]
				let end = position + 1

				while (end < original.length && highlighted[end] === shouldHighlight) {
					end++
				}

				const text = original.slice(position, end)

				if (shouldHighlight) {
					const mark = document.createElement("mark")
					mark.className = "search-highlight"
					mark.textContent = text
					element.appendChild(mark)
				} else {
					element.appendChild(document.createTextNode(text))
				}

				position = end
			}
		}

		/*
		 * Create a result row.
		 */

		function createResult(book, query) {
			const item = document.createElement("div")
			item.className = "search-item"

			const content = document.createElement("div")
			content.className = "search-item-content"

			// Book title

			const title = document.createElement("a")
			title.className = "search-title"
			title.href = book.url

			appendHighlightedText(title, book.book || book.title, query)

			content.appendChild(title)

			// Turkish title

			if (book.turkish && String(book.turkish).trim() !== "") {
				const turkish = document.createElement("p")
				turkish.className = "search-turkish"

				appendHighlightedText(turkish, book.turkish, query)

				content.appendChild(turkish)
			}

			// Author and date

			const meta = document.createElement("div")
			meta.className = "search-meta"

			const authorContainer = document.createElement("span")
			authorContainer.className = "search-author"

			const authors = String(book.author || "")
				.split(",")
				.map(function (name) {
					return name.trim()
				})
				.filter(function (name) {
					return name.length > 0
				})

			authors.forEach(function (authorName, index) {
				if (index > 0) {
					authorContainer.appendChild(document.createTextNode(", "))
				}

				const authorLink = document.createElement("a")
				authorLink.className = "search-author-link"

				authorLink.href =
					"{{ '/author.html' | relative_url }}?name=" +
					encodeURIComponent(authorName)

				appendHighlightedText(authorLink, authorName, query)

				authorContainer.appendChild(authorLink)
			})

			const date = document.createElement("span")
			date.className = "search-date"
			date.textContent = formatDate(book.date)

			meta.appendChild(authorContainer)
			meta.appendChild(date)

			content.appendChild(meta)

			if (showCategories) {
				const category = document.createElement("div")
				category.className = "search-category"
				const tags = (Array.isArray(book.tag) ? book.tag : String(book.tag || "").split(","))
					.map(function (tag) { return String(tag).trim() })
					.filter(Boolean)
				if (tags.length) {
					tags.forEach(function (tag, index) {
						if (index > 0) category.appendChild(document.createTextNode(", "))
						const link = document.createElement("a")
						link.href = "{{ '/category.html' | relative_url }}?tag=" + encodeURIComponent(tag)
						link.textContent = tag
						link.style.color = "inherit"
						link.style.textDecoration = "underline"
						category.appendChild(link)
					})
				} else {
					category.textContent = "Category: –"
				}
				content.appendChild(category)
			}

			item.appendChild(content)

			if (showCovers && typeof book.image === "string" && book.image.trim()) {
				const coverLink = document.createElement("a")
				coverLink.className = "search-cover-link"
				coverLink.href = book.url
				coverLink.setAttribute("aria-label", "View " + (book.book || book.title))

				const cover = document.createElement("img")
				cover.className = "search-cover"
				cover.src = book.image
				cover.alt = "Cover of " + (book.book || book.title)
				cover.loading = "lazy"
				cover.decoding = "async"
				cover.addEventListener("error", function () {
					coverLink.remove()
					item.classList.remove("has-cover")
				})

				coverLink.appendChild(cover)
				item.appendChild(coverLink)
				item.classList.add("has-cover")
			}

			return item
		}

		/*
		 * Sort by original publication date, newest first.
		 */

		function sortByDate(items) {
			return items.sort(function (a, b) {
				return String(b.date || "").localeCompare(String(a.date || ""))
			})
		}

		/*
		 * Update the URL without reloading the page.
		 */

		function updateSearchURL(query) {
			const url = new URL(window.location.href)
			const value = query.trim()

			if (value) {
				url.searchParams.set("q", value)
			} else {
				url.searchParams.delete("q")
			}

			window.history.replaceState(
				null,
				"",
				url.pathname + url.search + url.hash,
			)
		}

		/*
		 * Update Show All / Hide All button.
		 */

		function updateShowAllButton() {
			const help = document.getElementById("searchHelp")

			showAllButton.textContent = showAll ? "Hide All" : "Show All"

			showAllButton.setAttribute("aria-expanded", String(showAll))

			const description = showAll
				? "Showing all books. "
				: "Search for a book or author, or click "

			help.replaceChildren(document.createTextNode(description), showAllButton)

			if (!showAll) {
				help.appendChild(document.createTextNode("."))
			}
		}
		/*
		 * Render a list of books.
		 */

		function renderResults(matches, query, allMode) {
			resultsContainer.replaceChildren()

			status.textContent =
				matches.length + (matches.length === 1 ? " result" : " results")

			if (matches.length === 0) {
				status.textContent = "No results found."
				return
			}

			const fragment = document.createDocumentFragment()

			matches.forEach(function (book) {
				fragment.appendChild(createResult(book, allMode ? "" : query))
			})

			resultsContainer.appendChild(fragment)
		}

		/*
		 * Main search function.
		 */

		function searchBooks(query) {
			if (!isLoaded) return

			const normalizedQuery = normalizeText(query.trim())

			if (!normalizedQuery) {
				if (showAll) {
					renderResults(sortByDate(books.slice()), "", true)
				} else {
					resultsContainer.replaceChildren()
					status.textContent = ""
				}

				return
			}

			showAll = false
			updateShowAllButton()

			const terms = normalizedQuery.split(/\s+/)

			const matches = books.filter(function (book) {
				const searchableText = normalizeText(
					[book.book, book.turkish, book.title, book.author].join(" "),
				)

				return terms.every(function (term) {
					return searchableText.includes(term)
				})
			})

			sortByDate(matches)

			renderResults(matches, query, false)
		}

		document
			.querySelectorAll('input[name="searchCategories"]')
			.forEach(function (radio) {
				radio.addEventListener("change", function () {
					showCategories = radio.value === "with"
					searchBooks(input.value)
				})
			})

		document
			.querySelectorAll('input[name="searchCovers"]')
			.forEach(function (radio) {
				radio.addEventListener("change", function () {
					showCovers = radio.value === "with"
					searchBooks(input.value)
				})
			})

		/*
		 * Search input
		 */

		input.addEventListener("input", function () {
			clearTimeout(searchTimer)

			showAll = false
			updateShowAllButton()

			updateSearchURL(input.value)

			searchTimer = setTimeout(function () {
				searchBooks(input.value)
			}, 150)
		})

		/*
		 * Show All / Hide All
		 */

		showAllButton.addEventListener("click", function () {
			clearTimeout(searchTimer)

			if (showAll) {
				showAll = false
				input.value = ""
				updateSearchURL("")

				resultsContainer.replaceChildren()
				status.textContent = ""
			} else {
				showAll = true
				input.value = ""
				updateSearchURL("")

				if (isLoaded) {
					renderResults(sortByDate(books.slice()), "", true)
				}
			}

			updateShowAllButton()
		})

		/*
		 * Restore search from URL.
		 */

		const initialParams = new URLSearchParams(window.location.search)

		const initialQuery = initialParams.get("q") || ""

		if (initialQuery.trim()) {
			input.value = initialQuery
		}

		/*
		 * Restore the visible search when navigating
		 * through browser history.
		 */

		window.addEventListener("popstate", function () {
			clearTimeout(searchTimer)

			const params = new URLSearchParams(window.location.search)

			input.value = params.get("q") || ""
			showAll = false

			updateShowAllButton()
			searchBooks(input.value)
		})

		/*
		 * Load the search index.
		 */

		status.textContent = "Loading books..."
		updateShowAllButton()

		fetch("{{ '/search.json' | relative_url }}?v=categories-2", {
			cache: "no-store",
		})
			.then(function (response) {
				if (!response.ok) {
					throw new Error("Unable to load search index")
				}

				return response.json()
			})
			.then(function (data) {
				if (!Array.isArray(data)) {
					throw new Error("Invalid search index format")
				}

				books = data
				isLoaded = true

				status.textContent = ""

				if (showAll) {
					renderResults(sortByDate(books.slice()), "", true)
				} else if (input.value.trim()) {
					searchBooks(input.value)
				}
			})
			.catch(function (error) {
				console.error(error)
				status.textContent = "Unable to load books."
			})
	})()
</script>
