<style>
/* Next52books · Annotated Bibliography — scoped to these two pages */
.bib-directory{max-width:680px;margin:0 auto 4rem;font-family:'EB Garamond',Georgia,serif;color:#34312e}
.bib-directory *{box-sizing:border-box}
.bib-intro{font-size:16px;color:#89847e;margin:0 0 2.6rem;line-height:1.5}
.bib-entry{display:grid;grid-template-columns:46px minmax(0,1fr) 98px;gap:18px;padding:29px 0 34px;border-top:1px solid #e6e2dd;align-items:start;clear:both}
.bib-number{font:italic 12px Georgia,serif;color:#a5a09a;padding-top:5px;overflow-wrap:anywhere}
.bib-title{font-size:22px;line-height:1.23;font-weight:600;margin:0 0 8px}
.bib-title a{color:#302d2a;text-decoration:none;border-bottom:1px solid #c7c0b8}
.bib-title a:hover{border-bottom-color:#555}
.bib-author{font-size:16px;font-style:italic;color:#555;margin:0 0 2px}
.bib-year{font-size:13px;color:#888;margin:0 0 15px}
.bib-description{font-size:17px;line-height:1.55;overflow-wrap:anywhere}
.bib-description p{margin:0 0 .9em}
.bib-description>:first-child{margin-top:0}
.bib-description>:last-child{margin-bottom:0}
.bib-links{margin-top:16px;font:13px Georgia,serif;color:#777;display:flex;gap:16px;flex-wrap:wrap}
.bib-links a{color:inherit;text-decoration:none;border-bottom:1px solid #c7c0b8}
.bib-links a:hover{color:#333;border-bottom-color:#333}
.bib-cover{display:block;width:98px;max-width:100%;height:auto;object-fit:contain}
.bib-cover-link{display:block}
@media(max-width:600px){.bib-directory{width:100%}.bib-entry{grid-template-columns:30px minmax(0,1fr) 70px;gap:10px;padding:24px 0 27px}.bib-cover{width:70px}.bib-title{font-size:19px}.bib-description{font-size:16px}.bib-author{font-size:15px}.bib-number{font-size:10px}}
@media(max-width:390px){.bib-entry{grid-template-columns:1fr 62px;gap:12px}.bib-number{grid-column:1/-1;padding:0}.bib-cover{width:62px}}
</style>
