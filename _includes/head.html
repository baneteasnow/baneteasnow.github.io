<head>
	<meta charset="utf-8" />
	<meta
		http-equiv="X-UA-Compatible"
		content="IE=edge"
	/>
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1"
	/>
	<title>
		{%- if page.title -%} {{ page.title }} - next52books.com {%- else -%} {{
		site.title }} {%- endif -%}
	</title>

	{%-seo title=false-%} {%-feed_meta-%}
	<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any" />
	<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}" />
	<link rel="icon" type="image/png" sizes="96x96" href="{{ '/favicon-96x96.png' | relative_url }}" />
	<link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
	<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}" />

	<link
		rel="preconnect"
		href="https://fonts.googleapis.com"
	/>
	<link
		rel="preconnect"
		href="https://fonts.gstatic.com"
		crossorigin
	/>
	<link
		href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap"
		rel="stylesheet"
	/>
<link
  href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400;1,500&display=swap"
  rel="stylesheet"
/>
	<link
		rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css"
		crossorigin="anonymous"
		referrerpolicy="no-referrer"
	/>
{% if page.custom_manifest %}
	<link rel="manifest" href="{{ page.custom_manifest | relative_url }}" />
{% else %}
	<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}" />
{% endif %}
	<meta
		name="theme-color"
		content="#E8E4DF"
	/>
<!-- n52b PWA startup images (portrait) -->
<link rel="apple-touch-startup-image" href="/splashscreens/iphone-13-pro-max.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/splashscreens/iphone-17-pro-max.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-11.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-12-9.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-13.png" media="(device-width: 1032px) and (device-height: 1376px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
	<meta
		name="apple-mobile-web-app-capable"
		content="yes"
	/>
	<meta
		name="mobile-web-app-capable"
		content="yes"
	/>
	<meta
		name="apple-touch-fullscreen"
		content="yes"
	/>
	
</head>
