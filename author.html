</style>

<script>
	;(function () {
		"use strict"

		const params = new URLSearchParams(window.location.search)
		const author = params.get("name")

		const nameElement = document.querySelector(".page-content h4 a")
		const countElement = document.getElementById("authorCount")
		const booksElement = document.getElementById("authorBooks")
		let authorBooks = []
		let showCategories = false

		document.querySelectorAll('input[name="authorCategories"]').forEach(function (radio) {
			radio.addEventListener("change", function () {
				showCategories = radio.value === "with"
				renderAuthorBooks(authorBooks)
			})
		})

		const isIndex = !author || !author.trim()
		if (isIndex) {
			nameElement.textContent = "Authors"
			document.getElementById("authorCategoryChoice").hidden = true
		} else {
			nameElement.textContent = author
		}
		nameElement.href = isIndex ? "/" : "{{ '/author.html' | relative_url }}"
		countElement.textContent = "Loading books..."

		function normalizeText(value) {
			return String(value || "")
				.toLocaleLowerCase("tr-TR")
				.replace(/ı/g, "i")
				.replace(/ç/g, "c")
				.replace(/ğ/g, "g")
				.replace(/ö/g, "o")
				.replace(/ş/g, "s")
				.replace(/ü/g, "u")
				.normalize("NFD")
				.replace(/[\u0300-\u036f]/g, "")
		}

		function formatDate(value) {
			if (!value) return ""

			const parts = value.split("-")

			if (parts.length !== 3) return value

			const date = new Date(
				Number(parts[0]),
				Number(parts[1]) - 1,
				Number(parts[2]),
			)

			return date.toLocaleDateString("en-GB", {
				day: "numeric",
				month: "short",
				year: "numeric",
			})
		}

		function renderAuthorBooks(matches) {
			booksElement.replaceChildren()
				const fragment = document.createDocumentFragment()

				matches.forEach(function (book) {
					const item = document.createElement("div")
					item.className = "author-book"

					const title = document.createElement("a")
					title.className = "author-book-title"
					title.href = book.url
					title.textContent = book.book || book.title

					item.appendChild(title)

					const meta = document.createElement("div")
					meta.className = "author-book-meta"

					if (book.turkish) {
						const turkish = document.createElement("span")
						turkish.className = "author-book-turkish"
						turkish.textContent = book.turkish
						meta.appendChild(turkish)
					}

					const date = document.createElement("span")
					date.className = "author-book-date"
					date.textContent = formatDate(book.date)

					meta.appendChild(date)
					item.appendChild(meta)
					if (showCategories) {
						const category = document.createElement("div")
						category.className = "author-book-category"
						const tags = (Array.isArray(book.tag) ? book.tag : [book.tag])
							.map(t => String(t || "").trim()).filter(Boolean)
						if (tags.length) {
							tags.forEach((tag, i) => {
								if (i) category.appendChild(document.createTextNode(", "))
								const link = document.createElement("a")
								link.href = "{{ '/category.html' | relative_url }}?tag=" + encodeURIComponent(tag)
								link.textContent = tag
								category.appendChild(link)
							})
							item.appendChild(category)
						}
					}
					fragment.appendChild(item)
				})

				booksElement.appendChild(fragment)
		}

		fetch("{{ '/search.json' | relative_url }}?v=categories-2", { cache: "no-store" })
			.then(function (response) {
				if (!response.ok) {
					throw new Error("Unable to load books")
				}

				return response.json()
			})
			.then(function (books) {
				if (isIndex) {
					const names = new Map()
					books.forEach(book => {
						const seen = new Set()
						String(book.author || "").split(/\s*,\s*/).forEach(raw => {
							const n = raw.trim()
							const key = normalizeText(n)
							if (!n || seen.has(key)) return
							seen.add(key)
							if (!names.has(key)) names.set(key, { name: n, count: 0 })
							names.get(key).count++
						})
					})
					const sorted = [...names.values()].sort((a,b) => a.name.localeCompare(b.name, 'en', {sensitivity:'base'}))
					countElement.textContent = sorted.length + (sorted.length === 1 ? ' author' : ' authors')
					const ul = document.createElement('ul')
					ul.className = 'author-index'
					let letter = ''
					sorted.forEach(({ name: n, count }) => {
						const first = n.charAt(0).toLocaleUpperCase('en')
						if (first !== letter) {
							letter = first
							const heading = document.createElement('h2')
							heading.className = 'author-letter'
							heading.textContent = letter
							ul.appendChild(heading)
						}
						const li = document.createElement('li')
						const a = document.createElement('a')
						a.href = "{{ '/author.html' | relative_url }}?name=" + encodeURIComponent(n)
						 a.textContent = n
						li.appendChild(a)
						if (count > 1) {
							const number = document.createElement('span')
							number.className = 'number'
							number.textContent = count + ' books'
							li.appendChild(number)
						}
						ul.appendChild(li)
					})
					booksElement.replaceChildren(ul)
					return
				}
				const selectedAuthor = normalizeText(author.trim())

				const matches = books.filter(function (book) {
					return String(book.author || "")
						.split(/\s*,\s*/)
						.some(function (name) {
							return normalizeText(name.trim()) === selectedAuthor
						})
				})

				matches.sort(function (a, b) {
					return (b.date || "").localeCompare(a.date || "")
				})

				countElement.textContent =
					matches.length + (matches.length === 1 ? " book" : " books")

				if (matches.length === 0) {
					booksElement.textContent = "No books found for this author."
					return
				}

				authorBooks = matches
				renderAuthorBooks(matches)
			})
			.catch(function (error) {
				console.error(error)
				countElement.textContent = "Unable to load books."
			})
	})()
</script>
