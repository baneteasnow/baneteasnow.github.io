<div class="author-archive">
	<h1 id="authorName"></h1>
	<p
		id="authorCount"
		class="author-count"
	></p>
	<fieldset
		class="author-category-choice"
		aria-label="Category display"
	>
		<label
			><input
				type="radio"
				name="authorCategories"
				value="without"
				checked
			/>
			Without categories</label
		>
		<label
			><input
				type="radio"
				name="authorCategories"
				value="with"
			/>
			With categories</label
		>
	</fieldset>
	<div id="authorBooks"></div>
</div>

<style>
	.author-archive {
		max-width: 760px;
		margin: 0 auto;
	}

	.author-archive h1 {
		font-size: 26px;
		font-weight: 600;
		margin-bottom: 8px;
	}

	.author-count {
		font-size: 13px;
		color: #777;
		margin-bottom: 28px;
	}

	.author-book {
		padding: 15px 0;
		border-bottom: 1px solid #eee;
	}

	.author-book-title {
		display: block;
		color: #222;
		font-size: 14px;
		font-weight: 600;
		text-decoration: none;
	}

	.author-book-title:hover {
		text-decoration: underline;
	}

	.author-book-turkish {
		min-width: 0;
		font-size: 13px;
		color: #777;
		overflow-wrap: anywhere;
	}

	.author-book-meta {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
		gap: 12px;
		margin-top: 5px;
	}
	.author-book-date {
		font-size: 12px;
		color: #999;
		white-space: nowrap;
		margin-left: auto;
	}
	@media (max-width: 430px) {
		.author-book-meta {
			flex-direction: column;
			align-items: flex-start;
			gap: 3px;
		}
		.author-book-date {
			margin-left: 0;
		}
	}
	.author-category-choice {
		display: flex;
		flex-wrap: wrap;
		gap: 8px 20px;
		margin: 0 0 12px;
		padding: 0;
		border: 0;
		color: #666;
		font-size: 12px;
	}
	.author-category-choice label {
		display: inline-flex;
		align-items: center;
		gap: 6px;
		cursor: pointer;
	}
	.author-category-choice input {
		margin: 0;
		accent-color: #555;
	}
	.author-book-category {
		margin-top: 7px;
		color: #888;
		font-size: 12px;
		line-height: 1.5;
		overflow-wrap: anywhere;
	}
</style>

<script>
	;(function () {
		"use strict"

		const params = new URLSearchParams(window.location.search)
		const author = params.get("name")

		const nameElement = document.getElementById("authorName")
		const countElement = document.getElementById("authorCount")
		const booksElement = document.getElementById("authorBooks")
		let authorBooks = []
		let showCategories = false

		document
			.querySelectorAll('input[name="authorCategories"]')
			.forEach(function (radio) {
				radio.addEventListener("change", function () {
					showCategories = radio.value === "with"
					renderAuthorBooks(authorBooks)
				})
			})

		if (!author || !author.trim()) {
			nameElement.textContent = "Author not specified"
			return
		}

		nameElement.textContent = author
		countElement.textContent = "Loading books..."

		function normalizeText(value) {
			return String(value || "")
				.toLocaleLowerCase("tr-TR")
				.replace(/ı/g, "i")
				.replace(/ç/g, "c")
				.replace(/ğ/g, "g")
				.replace(/ö/g, "o")
				.replace(/ş/g, "s")
				.replace(/ü/g, "u")
				.normalize("NFD")
				.replace(/[\u0300-\u036f]/g, "")
		}

		function formatDate(value) {
			if (!value) return ""

			const parts = value.split("-")

			if (parts.length !== 3) return value

			const date = new Date(
				Number(parts[0]),
				Number(parts[1]) - 1,
				Number(parts[2]),
			)

			return date.toLocaleDateString("en-GB", {
				day: "2-digit",
				month: "short",
				year: "numeric",
			})
		}

		function renderAuthorBooks(matches) {
			booksElement.replaceChildren()
			const fragment = document.createDocumentFragment()

			matches.forEach(function (book) {
				const item = document.createElement("div")
				item.className = "author-book"

				const title = document.createElement("a")
				title.className = "author-book-title"
				title.href = book.url
				title.textContent = book.book || book.title

				item.appendChild(title)

				const meta = document.createElement("div")
				meta.className = "author-book-meta"

				if (book.turkish) {
					const turkish = document.createElement("span")
					turkish.className = "author-book-turkish"
					turkish.textContent = book.turkish
					meta.appendChild(turkish)
				}

				const date = document.createElement("span")
				date.className = "author-book-date"
				date.textContent = formatDate(book.date)

				meta.appendChild(date)
				item.appendChild(meta)
				if (showCategories) {
					const category = document.createElement("div")
					category.className = "author-book-category"
					const value = Array.isArray(book.category)
						? book.category.filter(Boolean).join(", ").trim()
						: String(book.category || "").trim()
					category.textContent = value || "Category: –"
					item.appendChild(category)
				}
				fragment.appendChild(item)
			})

			booksElement.appendChild(fragment)
		}

		fetch("{{ '/search.json' | relative_url }}?v=categories-2", {
			cache: "no-store",
		})
			.then(function (response) {
				if (!response.ok) {
					throw new Error("Unable to load books")
				}

				return response.json()
			})
			.then(function (books) {
				const selectedAuthor = normalizeText(author.trim())

				const matches = books.filter(function (book) {
					return String(book.author || "")
						.split(/\s*,\s*/)
						.some(function (name) {
							return normalizeText(name.trim()) === selectedAuthor
						})
				})

				matches.sort(function (a, b) {
					return (b.date || "").localeCompare(a.date || "")
				})

				countElement.textContent =
					matches.length + (matches.length === 1 ? " book" : " books")

				if (matches.length === 0) {
					booksElement.textContent = "No books found for this author."
					return
				}

				authorBooks = matches
				renderAuthorBooks(matches)
			})
			.catch(function (error) {
				console.error(error)
				countElement.textContent = "Unable to load books."
			})
	})()
</script>
