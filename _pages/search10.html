<div class="book-search">
	<div class="search-box">
		<input
			type="search"
			id="bookSearchInput"
			placeholder="Search by book title or author..."
			autocomplete="off"
			aria-label="Search books"
		/>
	</div>

	<div
		id="searchStatus"
		class="search-status"
		aria-live="polite"
	></div>

	<div
		id="searchResults"
		class="search-results"
	></div>
</div>

<style>
	.book-search {
		width: 100%;
		max-width: 760px;
		margin: 0 auto 40px;
		padding: 0 12px;
	}

	.book-search * {
		box-sizing: border-box;
	}

	.search-box {
		width: 100%;
	}

	#bookSearchInput {
		display: block;
		width: 100%;
		min-width: 0;
		padding: 14px 16px;
		border: 1px solid #d8d8d8;
		border-radius: 8px;
		background: #ffffff;
		color: #222222;
		font-family: inherit;
		font-size: 14px;
		line-height: 1.5;
		outline: none;
		-webkit-appearance: none;
		appearance: none;
	}

	#bookSearchInput:focus {
		border-color: #777777;
	}

	#bookSearchInput::placeholder {
		color: #999999;
	}

	.search-status {
		margin: 20px 0 10px;
		color: #888888;
		font-size: 12px;
	}

	.search-results {
		width: 100%;
	}

	.search-item {
		padding: 18px 10px;
		border-bottom: 1px solid #eeeeee;
		transition: background 0.15s ease;
	}

	.search-item:hover {
		background: #fafafa;
	}

	.search-title {
		display: block;
		margin: 0 0 5px;
		color: #222222;
		font-size: 14px;
		font-weight: 600;
		line-height: 1.5;
		text-decoration: none;
	}

	.search-title:hover {
		text-decoration: underline;
	}

	.search-turkish {
		margin: 0 0 8px;
		color: #888888;
		font-size: 13px;
		line-height: 1.5;
	}

	.search-meta {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 12px;
		color: #666666;
		font-size: 12px;
		line-height: 1.5;
	}

	.search-date {
		color: #999999;
		white-space: nowrap;
	}

	@media (max-width: 430px) {
		.book-search {
			padding: 0 4px;
		}

		.search-item {
			padding: 16px 4px;
		}

		.search-meta {
			flex-direction: column;
			align-items: flex-start;
			gap: 3px;
		}
	}
</style>

<script>
	;(function () {
		"use strict"

		const input = document.getElementById("bookSearchInput")
		const resultsContainer = document.getElementById("searchResults")
		const status = document.getElementById("searchStatus")

		let books = []
		let searchTimer

		function normalizeText(value) {
			return String(value || "")
				.toLocaleLowerCase("tr-TR")
				.replace(/ı/g, "i")
				.replace(/ç/g, "c")
				.replace(/ğ/g, "g")
				.replace(/ö/g, "o")
				.replace(/ş/g, "s")
				.replace(/ü/g, "u")
				.normalize("NFD")
				.replace(/[\u0300-\u036f]/g, "")
		}

		function formatDate(value) {
			if (!value) return ""

			const parts = value.split("-")

			if (parts.length !== 3) return value

			const date = new Date(
				Number(parts[0]),
				Number(parts[1]) - 1,
				Number(parts[2]),
			)

			return date.toLocaleDateString("en-GB", {
				day: "2-digit",
				month: "short",
				year: "numeric",
			})
		}

		function createResult(book) {
			const item = document.createElement("div")
			item.className = "search-item"

			const title = document.createElement("a")
			title.className = "search-title"
			title.href = book.url
			title.textContent = book.book || book.title

			item.appendChild(title)

			if (book.turkish && book.turkish.trim() !== "") {
				const turkish = document.createElement("p")
				turkish.className = "search-turkish"
				turkish.textContent = book.turkish

				item.appendChild(turkish)
			}

			const meta = document.createElement("div")
			meta.className = "search-meta"

			const author = document.createElement("span")
			author.textContent = book.author || ""

			const date = document.createElement("span")
			date.className = "search-date"
			date.textContent = formatDate(book.date)

			meta.appendChild(author)
			meta.appendChild(date)

			item.appendChild(meta)

			return item
		}

		function searchBooks(query) {
			const normalizedQuery = normalizeText(query.trim())

			resultsContainer.innerHTML = ""

			if (!normalizedQuery) {
				status.textContent = ""
				return
			}

			const terms = normalizedQuery.split(/\s+/)

			const matches = books.filter(function (book) {
				const searchableText = normalizeText(
					[book.book, book.turkish, book.title, book.author].join(" "),
				)

				return terms.every(function (term) {
					return searchableText.includes(term)
				})
			})

			matches.sort(function (a, b) {
				return b.date.localeCompare(a.date)
			})

			status.textContent =
				matches.length + (matches.length === 1 ? " result" : " results")

			if (matches.length === 0) {
				status.textContent = "No results found."
				return
			}

			const fragment = document.createDocumentFragment()

			matches.forEach(function (book) {
				fragment.appendChild(createResult(book))
			})

			resultsContainer.appendChild(fragment)
		}

		input.addEventListener("input", function () {
			clearTimeout(searchTimer)

			searchTimer = setTimeout(function () {
				searchBooks(input.value)
			}, 150)
		})

		status.textContent = "Loading books..."

		fetch("{{ '/search10.json' | relative_url }}")
			.then(function (response) {
				if (!response.ok) {
					throw new Error("Unable to load search index")
				}

				return response.json()
			})
			.then(function (data) {
				books = data

				status.textContent = ""

				if (input.value.trim()) {
					searchBooks(input.value)
				}
			})
			.catch(function (error) {
				console.error(error)
				status.textContent = "Unable to load books."
			})
	})()
</script>
