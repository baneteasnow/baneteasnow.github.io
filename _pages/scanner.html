<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>QR Scanner – Restricted to My Domain</title>
		<style>
			body {
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					sans-serif;
				max-width: 600px;
				margin: 40px auto;
				padding: 0 16px 40px;
				text-align: center;
				background: #ffffff;
				color: #000000;
			}

			h1 {
				font-size: 24px;
				margin-bottom: 8px;
			}

			p {
				font-size: 14px;
				margin-bottom: 12px;
			}

			code {
				font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
					"Courier New", monospace;
				font-size: 13px;
			}

			video {
				width: 100%;
				max-width: 400px;
				border: 1px solid #ccc;
				border-radius: 8px;
				margin-top: 16px;
			}

			#status {
				margin-top: 12px;
				font-size: 14px;
			}

			#link {
				margin-top: 12px;
				word-break: break-all;
				font-size: 14px;
			}

			button {
				padding: 8px 16px;
				margin-top: 16px;
				cursor: pointer;
				font-size: 14px;
				border-radius: 6px;
				border: 1px solid #999;
				background: #e5e5e5; /* grey button */
				color: #000; /* black text */
			}

			button:hover {
				background: #d4d4d4;
			}
		</style>
	</head>
	<body>
		<h1>QR Scanner</h1>
		<p>
			This scanner only accepts QR codes linking to
			<code
				style="
					color: #000 !important;
					background: #f1f1f1;
					padding: 2px 4px;
					border-radius: 4px;
				"
			>
				next52books.com
			</code>
		</p>

		<button id="startBtn">Start Camera</button>

		<video
			id="video"
			playsinline
		></video>
		<canvas
			id="canvas"
			style="display: none"
		></canvas>

		<div id="status">Ready.</div>
		<div id="link"></div>
		<br />
		<div style="clear: both"></div>
		<!-- jsQR library -->
		<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
		<script>
			/* WRITE YOUR OWN DOMAIN HERE */
			const BASE_URL = "https://www.next52books.com"

			const startBtn = document.getElementById("startBtn")
			const video = document.getElementById("video")
			const canvas = document.getElementById("canvas")
			const statusEl = document.getElementById("status")
			const linkEl = document.getElementById("link")

			let stream
			let scanning = false

			startBtn.addEventListener("click", async () => {
				try {
					stream = await navigator.mediaDevices.getUserMedia({
						video: { facingMode: "environment" }, // back camera
					})
					video.srcObject = stream
					await video.play()
					scanning = true
					statusEl.textContent = "Waiting for QR code..."
					scanLoop()
				} catch (err) {
					console.error(err)
					statusEl.textContent = "Camera access failed: " + err.message
				}
			})

			function scanLoop() {
				if (!scanning) return

				const width = video.videoWidth
				const height = video.videoHeight

				if (!width || !height) {
					requestAnimationFrame(scanLoop)
					return
				}

				canvas.width = width
				canvas.height = height
				const ctx = canvas.getContext("2d")
				ctx.drawImage(video, 0, 0, width, height)
				const imageData = ctx.getImageData(0, 0, width, height)

				const code = jsQR(imageData.data, width, height)

				if (code && code.data) {
					const text = code.data.trim()
					statusEl.textContent = "QR detected."
					linkEl.textContent = text

					// Domain check
					if (text.startsWith(BASE_URL)) {
						scanning = false
						stopStream()
						statusEl.textContent = "Valid domain. Redirecting..."
						const go = confirm("Do you want to open this link?\n" + text)
						if (go) {
							window.location.href = text
						}
					} else {
						statusEl.textContent =
							"QR detected but domain does not match. Only " +
							BASE_URL +
							" is allowed."
					}
				} else {
					// Continue scanning
					requestAnimationFrame(scanLoop)
				}
			}

			function stopStream() {
				if (stream) {
					stream.getTracks().forEach((t) => t.stop())
				}
			}
		</script>
	</body>
</html>
