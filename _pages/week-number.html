<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Week Number Finder</title>

		<style>
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 0 20px 60px;
				background: #ffffff;
				color: #111111;
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
			}

			.page-wrap {
				max-width: 820px;
				margin: 0 auto;
			}

			.page-title {
				margin: 36px 0 28px;
				font-family: Georgia, "Times New Roman", serif;
				font-size: 42px;
				font-style: italic;
				font-weight: 700;
				color: #444444;
				text-transform: lowercase;
			}

			.card {
				max-width: 620px;
				margin: 0 auto;
				padding: 52px 48px 48px;
				border: 1px solid #e4e4e4;
				border-radius: 18px;
				background: #ffffff;
				box-shadow: 0 18px 45px rgba(0, 0, 0, 0.06);
				text-align: center;
			}

			.card h1 {
				margin: 0 0 20px;
				font-size: 36px;
				font-weight: 800;
				letter-spacing: -0.03em;
			}

			.description {
				margin: 0 0 34px;
				font-size: 18px;
				color: #2f3747;
			}

			.date-input {
				width: 100%;
				max-width: 460px;
				padding: 14px 16px;
				border: 1px solid #cfd3da;
				border-radius: 8px;
				font-size: 22px;
				background: #ffffff;
				color: #111111;
			}

			.split-result {
				max-width: 620px;
				margin: 26px auto 0;
				padding: 24px 28px;
				border: 1px solid #e4e4e4;
				border-radius: 16px;
				background: #ffffff;
				box-shadow: 0 14px 34px rgba(0, 0, 0, 0.05);
				display: grid;
				grid-template-columns: 1fr 1px 1fr;
				align-items: center;
				text-align: center;
			}

			.vertical-divider {
				width: 1px;
				height: 70px;
				background: #dddddd;
			}

			.split-label {
				margin: 0 0 8px;
				font-size: 17px;
				color: #2f3747;
			}

			.split-date {
				margin: 0;
				font-size: 22px;
				font-weight: 750;
			}

			.split-week {
				margin: 0;
				font-size: 36px;
				font-weight: 800;
				color: #0b63f6;
			}

			@media (max-width: 640px) {
				.page-title {
					font-size: 34px;
				}

				.card {
					padding: 38px 24px 40px;
				}

				.card h1 {
					font-size: 30px;
				}

				.description {
					font-size: 16px;
				}

				.date-input {
					font-size: 18px;
				}

				.split-result {
					grid-template-columns: 1fr;
					gap: 18px;
				}

				.vertical-divider {
					display: none;
				}
			}
		</style>
	</head>

	<body>
		<main class="page-wrap">
			<div class="page-title">week number finder</div>

			<section class="card">
				<h1>Week Number</h1>

				<p class="description">Select a date to get the week number.</p>

				<input
					type="date"
					id="datePicker"
					class="date-input"
				/>
			</section>

			<section class="split-result">
				<div>
					<p class="split-label">Selected Date</p>
					<p
						class="split-date"
						id="splitDate"
					>
						—
					</p>
				</div>

				<div class="vertical-divider"></div>

				<div>
					<p class="split-label">Week Number</p>
					<p
						class="split-week"
						id="splitWeek"
					>
						—
					</p>
				</div>
			</section>
		</main>

		<script>
			function getISOWeekNumber(date) {
				const d = new Date(
					Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()),
				)

				d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7))

				const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1))

				return Math.ceil(((d - yearStart) / 86400000 + 1) / 7)
			}

			function formatDate(date) {
				return date.toLocaleDateString("en-US", {
					year: "numeric",
					month: "long",
					day: "numeric",
				})
			}

			function updateWeekNumber() {
				const input = document.getElementById("datePicker")
				const value = input.value

				if (!value) {
					return
				}

				const date = new Date(value + "T00:00:00")
				const weekNumber = getISOWeekNumber(date)
				const formattedDate = formatDate(date)

				document.getElementById("splitDate").textContent = formattedDate
				document.getElementById("splitWeek").textContent = weekNumber
			}

			const today = new Date()
			const todayString = today.toISOString().split("T")[0]

			document.getElementById("datePicker").value = todayString
			document
				.getElementById("datePicker")
				.addEventListener("change", updateWeekNumber)

			updateWeekNumber()
		</script>
	</body>
</html>
