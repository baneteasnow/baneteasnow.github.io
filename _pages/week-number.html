<script>
	const datePicker = document.getElementById("datePicker")
	const selectedDateEl = document.getElementById("selectedDate")
	const selectedDayEl = document.getElementById("selectedDay")
	const weekNumberEl = document.getElementById("weekNumber")
	const calendarHeader = document.getElementById("calendarHeader")
	const calendarGrid = document.getElementById("calendarGrid")

	function getISOWeekNumber(date) {
		const d = new Date(
			Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()),
		)

		d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7))

		const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1))

		return Math.ceil(((d - yearStart) / 86400000 + 1) / 7)
	}

	function formatDate(date) {
		return date.toLocaleDateString("en-US", {
			year: "numeric",
			month: "long",
			day: "numeric",
		})
	}

	function formatDay(date) {
		return date.toLocaleDateString("en-US", {
			weekday: "long",
		})
	}

	function formatMonth(date) {
		return date.toLocaleDateString("en-US", {
			month: "long",
			year: "numeric",
		})
	}

	function formatDateForInput(date) {
		const year = date.getFullYear()
		const month = String(date.getMonth() + 1).padStart(2, "0")
		const day = String(date.getDate()).padStart(2, "0")

		return `${year}-${month}-${day}`
	}

	function datesAreEqual(firstDate, secondDate) {
		return (
			firstDate.getFullYear() === secondDate.getFullYear() &&
			firstDate.getMonth() === secondDate.getMonth() &&
			firstDate.getDate() === secondDate.getDate()
		)
	}

	function renderCalendar(selectedDate) {
		calendarGrid.innerHTML = ""

		const year = selectedDate.getFullYear()
		const month = selectedDate.getMonth()

		calendarHeader.textContent = formatMonth(selectedDate)

		const firstDayOfMonth = new Date(year, month, 1)
		const lastDayOfMonth = new Date(year, month + 1, 0)

		/*
		 * Takvim Pazartesi günü başlıyor.
		 * Ayın ilk gününün bulunduğu haftanın Pazartesi gününü buluyoruz.
		 */
		const firstDayOffset = (firstDayOfMonth.getDay() + 6) % 7

		const calendarStart = new Date(year, month, 1 - firstDayOffset)

		/*
		 * Ayın son gününün bulunduğu haftanın Pazar gününü buluyoruz.
		 */
		const lastDayOffset = (7 - lastDayOfMonth.getDay()) % 7

		const calendarEnd = new Date(
			year,
			month,
			lastDayOfMonth.getDate() + lastDayOffset,
		)

		const currentWeekStart = new Date(calendarStart)

		while (currentWeekStart <= calendarEnd) {
			/*
			 * Her satır Pazartesi ile başladığı için
			 * hafta numarasını bu Pazartesi tarihinden hesaplıyoruz.
			 */
			const weekNumberElement = document.createElement("span")
			weekNumberElement.className = "calendar-week-number"
			weekNumberElement.textContent = getISOWeekNumber(currentWeekStart)
			weekNumberElement.title = `Week ${getISOWeekNumber(currentWeekStart)}`

			calendarGrid.appendChild(weekNumberElement)

			for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
				const currentDate = new Date(
					currentWeekStart.getFullYear(),
					currentWeekStart.getMonth(),
					currentWeekStart.getDate() + dayOffset,
				)

				const dayElement = document.createElement("span")
				dayElement.className = "calendar-day"

				if (currentDate.getMonth() !== month) {
					dayElement.classList.add("empty")
					dayElement.textContent = ""
				} else {
					dayElement.textContent = currentDate.getDate()

					if (datesAreEqual(currentDate, selectedDate)) {
						dayElement.classList.add("selected")
					}
				}

				calendarGrid.appendChild(dayElement)
			}

			currentWeekStart.setDate(currentWeekStart.getDate() + 7)
		}
	}

	function updatePage() {
		const value = datePicker.value

		if (!value) {
			return
		}

		const selectedDate = new Date(`${value}T00:00:00`)
		const weekNumber = getISOWeekNumber(selectedDate)

		selectedDateEl.textContent = formatDate(selectedDate)
		selectedDayEl.textContent = formatDay(selectedDate)
		weekNumberEl.textContent = weekNumber

		renderCalendar(selectedDate)
	}

	const today = new Date()

	datePicker.value = formatDateForInput(today)
	datePicker.addEventListener("change", updatePage)

	updatePage()
</script>
