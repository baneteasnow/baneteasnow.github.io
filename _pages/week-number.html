<div class="week-page">
	<section class="calendar-card">
		<nav class="calendar-header" aria-label="Calendar months"><button type="button" id="previousMonth"></button><h2 id="calendarHeader" aria-live="polite"></h2><button type="button" id="nextMonth"></button></nav>

		<div class="calendar-weekdays">
			<span class="week-heading">wk</span>
			<span>M</span>
			<span>T</span>
			<span>W</span>
			<span>T</span>
			<span>F</span>
			<span>S</span>
			<span>S</span>
		</div>

		<div
			class="calendar-grid"
			id="calendarGrid"
		></div>
	</section>

	<section class="result-card" aria-live="polite" aria-atomic="true">
		<div>
			<p class="result-label">Selected Date</p>

			<p
				class="selected-date"
				id="selectedDate"
			>
				—
			</p>
			<p class="day-of-year" id="dayOfYear">—</p>

			<p
				class="selected-day"
				id="selectedDay"
			>
				—
			</p>
		</div>

		<div class="divider"></div>

		<div>
			<p class="result-label">Week Number</p>

			<p
				class="week-number"
				id="weekNumber"
			>
				—
			</p>
		</div>
	</section>
</div>

<style>

.week-page, .week-page * { box-sizing: border-box; }
.week-page { width:100%; max-width:640px; margin:0 auto; padding:12px 16px 40px; background:#fff; color:#393632; font-family:"EB Garamond",Georgia,serif; line-height:1.5; }
.week-page button, .week-page input { font:inherit; color:inherit; }
.week-page .date-card { text-align:center; padding:12px 0 32px; }
.week-page .date-card label { display:block; margin-bottom:16px; font-size:17px; }
.week-page .date-input { display:block; width:100%; max-width:300px; min-width:0; margin:auto; padding:10px 14px; border:1px solid #d9d2ca; border-radius:0; background:#fff; text-align:center; }
.week-page .calendar-card { padding:0; background:#fff; }
.week-page .calendar-header { display:grid; grid-template-columns:1fr 1.3fr 1fr; align-items:center; gap:8px; margin-bottom:22px; }
.week-page .calendar-header h2 { margin:0; font:400 23px/1.3 "EB Garamond",Georgia,serif; text-align:center; }
.week-page .calendar-header button { border:0; padding:10px 0; background:transparent; color:#9A8878; font-size:16px; font-style:italic; cursor:pointer; text-align:left; }
.week-page .calendar-header button:last-child { text-align:right; }
.week-page button:hover { color:#55483e; }
.week-page button:focus-visible, .week-page input:focus-visible { outline:2px solid #9A8878; outline-offset:3px; }
.week-page .calendar-weekdays, .week-page .calendar-row { display:grid; grid-template-columns:32px repeat(7,minmax(0,1fr)); text-align:center; align-items:center; }
.week-page .calendar-weekdays { min-height:34px; color:#82786e; font-size:13px; }
.week-page .week-heading, .week-page .calendar-week-number { color:#9A8878; font-size:12px; font-weight:400; font-style:italic; }
.week-page .calendar-row { min-height:55px; border-top:1px solid #e5dfd8; }
.week-page .calendar-row:last-child { border-bottom:1px solid #e5dfd8; }
.week-page .calendar-row.selected-week { background:#F3F0EC; }
.week-page .calendar-day { display:flex; align-items:center; justify-content:center; justify-self:center; width:36px; height:36px; padding:0; border:1px solid transparent; border-radius:50%; background:transparent; font-size:17px; font-weight:400; cursor:pointer; }
.week-page .calendar-day.selected { border-color:#857467; }
.week-page .calendar-day:hover { background:#ebe6df; }
.week-page .result-card { display:grid; grid-template-columns:1fr 1px 1fr; align-items:center; gap:24px; margin-top:34px; padding:24px 0; text-align:center; border-top:1px solid #e5dfd8; }
.week-page .result-card p { margin:0; }
.week-page .result-label { color:#9A8878; font-size:14px; font-style:italic; }
.week-page .selected-date { padding-top:9px; font-size:20px; }
.week-page .selected-day { color:#82786e; font-size:15px; padding-top:4px; }
.week-page .divider { width:1px; height:75px; background:#e5dfd8; }
.week-page .week-number { color:#675547; font-size:52px; font-weight:400; line-height:1.2; }
.week-page .day-of-year { color:#9A8878; font-size:13px; font-style:italic; padding-top:4px; }
@media(max-width:430px) { .week-page { padding:8px 8px 28px; } .week-page .calendar-weekdays,.week-page .calendar-row { grid-template-columns:24px repeat(7,minmax(0,1fr)); } .week-page .calendar-day { width:30px; height:30px; font-size:16px; } .week-page .calendar-row { min-height:48px; } .week-page .calendar-header h2 { font-size:20px; } .week-page .calendar-header button { font-size:14px; } .week-page .result-card { gap:12px; } .week-page .selected-date { font-size:18px; } }

/* Fine internal rules, with no outer calendar frame. */
.week-page .calendar-row { position:relative; border-top:0; }
.week-page .calendar-row:last-child { border-bottom:0; }
.week-page .calendar-row + .calendar-row::before { content:""; position:absolute; top:0; left:32px; right:0; border-top:1px solid #ded6cc; pointer-events:none; }
.week-page .calendar-row > :nth-child(n+3) { position:relative; }
.week-page .calendar-row > :nth-child(n+3)::before { content:""; position:absolute; left:0; top:0; bottom:0; border-left:1px solid #ded6cc; pointer-events:none; }
.week-page .calendar-cell { display:flex; align-items:center; justify-content:center; align-self:stretch; min-width:0; }
.week-page .calendar-header button { font-style:normal; font-size:27px; min-height:44px; }
.week-page .calendar-header { margin-top:12px; }
@media(max-width:430px) { .week-page .calendar-row + .calendar-row::before { left:24px; } }

/* Frame the highlighted week across its week-number column too. */
.week-page .calendar-row.selected-week::before,
.week-page .calendar-row.selected-week::after { content:""; position:absolute; left:0; right:0; border-top:1px solid #ded6cc; pointer-events:none; }
.week-page .calendar-row.selected-week::before { top:0; }
.week-page .calendar-row.selected-week::after { bottom:0; }
/* The next row shares this boundary; draw it only once. */
.week-page .calendar-row.selected-week + .calendar-row::before { content:none; }
</style>
<script>

(() => {
  const el = id => document.getElementById(id);
  const grid = el('calendarGrid');
  const previous = el('previousMonth');
  const next = el('nextMonth');
  const makeDate = (y,m,d=1) => { const date = new Date(0); date.setFullYear(y,m,d); date.setHours(12,0,0,0); return date; };
  const utcDay = date => { const d = new Date(0); d.setUTCFullYear(date.getFullYear(),date.getMonth(),date.getDate()); d.setUTCHours(0,0,0,0); return d; };
  function isoWeek(date) {
    const d = utcDay(date);
    d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay() || 7));
    const start = new Date(d); start.setUTCMonth(0,1);
    return Math.ceil(((d-start)/86400000+1)/7);
  }
  const inputValue = d => `${String(d.getFullYear()).padStart(4,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const monthName = d => d.toLocaleDateString('en-US',{month:'long'});
  const fullDate = d => d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  let selectedDate = new Date();
  let displayedMonth = makeDate(selectedDate.getFullYear(),selectedDate.getMonth());
  function renderCalendar() {
    const y=displayedMonth.getFullYear(), m=displayedMonth.getMonth();
    const prev=makeDate(y,m-1), following=makeDate(y,m+1);
    previous.textContent='<'; next.textContent='>';
    previous.setAttribute('aria-label',`Show ${monthName(prev)} ${prev.getFullYear()}`);
    next.setAttribute('aria-label',`Show ${monthName(following)} ${following.getFullYear()}`);
    el('calendarHeader').textContent=`${monthName(displayedMonth)} ${displayedMonth.getFullYear()}`;
    grid.replaceChildren();
    const offset=(displayedMonth.getDay()+6)%7;
    const last=makeDate(y,m+1,0).getDate();
    for(let start=1-offset; start<=last; start+=7) {
      const row=document.createElement('div'); row.className='calendar-row';
      const monday=makeDate(y,m,start);
      const sunday=makeDate(y,m,start+6);
      if(utcDay(selectedDate)>=utcDay(monday) && utcDay(selectedDate)<=utcDay(sunday)) row.classList.add('selected-week');
      const week=document.createElement('span'); week.className='calendar-week-number';
      week.textContent=isoWeek(monday); week.setAttribute('aria-label',`ISO week ${isoWeek(monday)}`); row.appendChild(week);
      for(let i=0;i<7;i++) {
        const day=start+i;
        if(day<1 || day>last) { const blank=document.createElement('span'); blank.className='calendar-cell'; blank.setAttribute('aria-hidden','true'); row.appendChild(blank); continue; }
        const date=makeDate(y,m,day), button=document.createElement('button');
        button.type='button'; button.className='calendar-day'; button.textContent=day;
        const chosen=inputValue(date)===inputValue(selectedDate);
        button.classList.toggle('selected',chosen); button.setAttribute('aria-pressed',String(chosen)); button.setAttribute('aria-label',fullDate(date));
        button.addEventListener('click',()=>{ selectDate(date); grid.querySelector('[aria-pressed="true"]').focus(); }); const cell=document.createElement('div'); cell.className='calendar-cell'; cell.appendChild(button); row.appendChild(cell);
      }
      grid.appendChild(row);
    }
  }
  function selectDate(date) {
    selectedDate=date; displayedMonth=makeDate(date.getFullYear(),date.getMonth());
    el('selectedDate').textContent=fullDate(date);
    el('selectedDay').textContent=date.toLocaleDateString('en-US',{weekday:'long'});
    el('weekNumber').textContent=isoWeek(date);
    const ordinal=Math.round((utcDay(date)-utcDay(makeDate(date.getFullYear(),0,1)))/86400000)+1;
    const total=makeDate(date.getFullYear(),1,29).getMonth()===1?366:365;
    el('dayOfYear').textContent=`${ordinal} / ${total}`;
    renderCalendar();
  }
  previous.addEventListener('click',()=>{ displayedMonth=makeDate(displayedMonth.getFullYear(),displayedMonth.getMonth()-1); renderCalendar(); });
  next.addEventListener('click',()=>{ displayedMonth=makeDate(displayedMonth.getFullYear(),displayedMonth.getMonth()+1); renderCalendar(); });
  selectDate(selectedDate);
})();
</script>
