<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="UTF-8" />
		<title>QR Generator – Image Links</title>
		<style>
			body {
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					sans-serif;
				max-width: 600px;
				margin: 40px auto;
				padding: 0 16px;
			}
			label,
			input,
			button {
				font-size: 16px;
			}
			input {
				width: 100%;
				padding: 8px;
				margin: 8px 0 12px;
			}
			button {
				padding: 8px 16px;
				cursor: pointer;
				margin-right: 8px;
			}
			#qrcode {
				margin-top: 24px;
				text-align: center;
			}
			#finalUrl,
			#generatedDate {
				margin-top: 12px;
				font-size: 14px;
				text-align: center;
				word-break: break-all;
			}
			#generatedDate {
				font-size: 12px;
				color: #555;
				margin-top: 6px;
			}

			/* Print Mode */
			@media print {
				body {
					margin: 0;
					padding: 20px;
				}
				h1,
				p,
				label,
				input,
				button {
					display: none !important;
				}
				#qrcode,
				#finalUrl,
				#generatedDate {
					display: block !important;
					text-align: center;
				}
			}
		</style>
	</head>
	<body>
		<h1>QR Generator</h1>
		<p>
			Resim dosya adını veya yolunu yaz: (ör. <code>img/harari-nexus.jpg</code>)
		</p>

		<label for="pathInput">Path / file name</label>
		<input
			id="pathInput"
			placeholder="img/harari-nexus.jpg"
		/>

		<button id="generateBtn">QR üret</button>
		<button id="printBtn">Yazdır</button>

		<div id="finalUrl"></div>
		<div id="generatedDate"></div>
		<div id="qrcode"></div>

		<!-- QR library -->
		<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
		<script>
			/* KENDİ DOMAINİNİ BURAYA YAZ */
			const BASE_URL = "https://next52books.com/"

			const input = document.getElementById("pathInput")
			const btn = document.getElementById("generateBtn")
			const printBtn = document.getElementById("printBtn")
			const finalUrlEl = document.getElementById("finalUrl")
			const dateEl = document.getElementById("generatedDate")
			const qrContainer = document.getElementById("qrcode")

			let qr

			function createOrUpdateQR(text) {
				if (!qr) {
					qr = new QRCode(qrContainer, {
						text,
						width: 256,
						height: 256,
					})
				} else {
					qr.clear()
					qr.makeCode(text)
				}
			}

			function getEnglishDate() {
				const now = new Date()
				const opts = {
					year: "numeric",
					month: "short",
					day: "numeric",
					hour: "2-digit",
					minute: "2-digit",
				}
				return now.toLocaleString("en-US", opts)
			}

			btn.addEventListener("click", () => {
				const path = input.value.trim()
				if (!path) {
					alert("Önce bir path / dosya adı yaz.")
					return
				}

				const url =
					BASE_URL.replace(/\/+$/, "") + "/" + path.replace(/^\/+/, "")
				finalUrlEl.textContent = "URL: " + url

				createOrUpdateQR(url)

				// Tarih yaz
				dateEl.textContent = "Generated on: " + getEnglishDate()
			})

			printBtn.addEventListener("click", () => {
				if (!finalUrlEl.textContent) {
					alert("Önce QR üret.")
					return
				}
				window.print()
			})
		</script>
	</body>
</html>
