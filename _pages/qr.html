<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>QR Generator – Image Links</title>
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					sans-serif;
				max-width: 600px;
				margin: 40px auto;
				padding: 0 16px 40px;
				background: #ffffff;
				color: #000000;
			}

			h1 {
				font-size: 24px;
				margin-bottom: 8px;
			}

			p {
				font-size: 14px;
				margin-bottom: 12px;
				color: #000;
			}

			label,
			input,
			button {
				font-size: 14px;
			}

			label {
				display: block;
				margin-bottom: 4px;
			}

			input {
				width: 100%;
				padding: 10px;
				margin: 8px 0 12px;
				border: 1px solid #c9c9c9;
				border-radius: 6px;
				background: #ffffff;
				color: #000;
			}

			input::placeholder {
				color: #666;
			}

			button {
				padding: 8px 16px;
				cursor: pointer;
				margin-right: 8px;
				margin-bottom: 6px;
				border-radius: 6px;
				border: 1px solid #999;
				background: #e5e5e5;
				color: #000;
			}

			button:hover {
				background: #d4d4d4;
			}

			#qrcode {
				margin-top: 24px;
				text-align: center;
			}

			#finalUrl,
			#generatedDate {
				margin-top: 12px;
				font-size: 13px;
				text-align: center;
				word-break: break-all;
				color: #000;
			}

			#generatedDate {
				font-size: 12px;
				color: #555;
				margin-top: 6px;
			}
		</style>
	</head>
	<body>
		<p>
			Enter the image file name or path (e.g.
			<code
				style="
					color: #000 !important;
					background: #f1f1f1;
					padding: 2px 4px;
					border-radius: 4px;
				"
			>
				assets/new/nexus.jpg
			</code>
			)
		</p>

		<label for="pathInput">Path / file name</label>
		<input
			id="pathInput"
			placeholder="assets/new/nexus-harari.jpg"
		/>

		<button id="generateBtn">Generate QR</button>
		<button id="downloadBtn">Download PNG</button>

		<div id="finalUrl"></div>
		<div id="generatedDate"></div>
		<div id="qrcode"></div>

		<!-- Hidden canvas used for exporting QR + title + date as an image -->
		<canvas
			id="exportCanvas"
			style="display: none"
		></canvas>
		<br />
		<div style="clear: both"></div>

		<!-- QR library -->
		<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
		<script>
			/* WRITE YOUR OWN DOMAIN HERE */
			const BASE_URL = "https://www.next52books.com/"

			const input = document.getElementById("pathInput")
			const btn = document.getElementById("generateBtn")
			const downloadBtn = document.getElementById("downloadBtn")
			const finalUrlEl = document.getElementById("finalUrl")
			const dateEl = document.getElementById("generatedDate")
			const qrContainer = document.getElementById("qrcode")
			const exportCanvas = document.getElementById("exportCanvas")

			let qr
			let lastPath = ""
			let lastUrl = ""

			function createOrUpdateQR(text) {
				if (!qr) {
					qr = new QRCode(qrContainer, {
						text,
						width: 256,
						height: 256,
					})
				} else {
					qr.clear()
					qr.makeCode(text)
				}
			}

			function getEnglishDate() {
				const now = new Date()
				const opts = {
					year: "numeric",
					month: "short",
					day: "numeric",
					hour: "2-digit",
					minute: "2-digit",
				}
				return now.toLocaleString("en-US", opts)
			}

			// Nexus-harari.jpg -> Nexus Harari
			function extractCleanTitle(pathOrUrl) {
				if (!pathOrUrl) return "QR Code"
				let file = pathOrUrl.split("/").pop() // assets/new/nexus-harari.jpg -> nexus-harari.jpg
				file = file.replace(/\.[a-zA-Z0-9]+$/, "") // remove extension
				file = file.replace(/-/g, " ") // dashes to spaces
				file = file.replace(/\s+/g, " ").trim()
				return file.replace(/\b\w/g, (c) => c.toUpperCase())
			}

			// For filename: qr-nexus-harari-YYYYMMDD-HHMM.png
			function makeSlug(pathOrUrl) {
				if (!pathOrUrl) return "qr"
				let base = pathOrUrl.split("/").pop()
				base = base.replace(/\.[a-zA-Z0-9]+$/, "")
				return base
					.toLowerCase()
					.replace(/[^a-z0-9\-]+/g, "-")
					.replace(/-+/g, "-")
					.replace(/^-|-$/g, "")
			}

			btn.addEventListener("click", () => {
				const path = input.value.trim()
				if (!path) {
					alert("Please enter a path or file name first.")
					return
				}

				const url =
					BASE_URL.replace(/\/+$/, "") + "/" + path.replace(/^\/+/, "")

				lastPath = path
				lastUrl = url

				finalUrlEl.textContent = "URL: " + url

				createOrUpdateQR(url)

				// Add timestamp
				dateEl.textContent = "Generated on: " + getEnglishDate()
			})

			function downloadPng() {
				if (!lastUrl) {
					alert("Generate a QR code first.")
					return
				}

				const img = qrContainer.querySelector("img")
				const qrCanvas = qrContainer.querySelector("canvas")
				const sourceEl = img || qrCanvas

				if (!sourceEl) {
					alert("QR code image is not ready yet.")
					return
				}

				const qrSize = sourceEl.naturalWidth || sourceEl.width || 256
				const padding = 20

				const titleText = extractCleanTitle(lastPath || lastUrl || "QR Code")
				const dateText = dateEl.textContent || ""

				// QR + title + date layout (QR on top, text under it)
				exportCanvas.width = qrSize + padding * 2
				exportCanvas.height = qrSize + 90

				const ctx = exportCanvas.getContext("2d")

				// White background
				ctx.fillStyle = "#ffffff"
				ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height)

				// Draw QR
				const qrX = padding
				const qrY = padding
				ctx.drawImage(sourceEl, qrX, qrY, qrSize, qrSize)

				const centerX = exportCanvas.width / 2

				// Title under QR
				ctx.fillStyle = "#000000"
				ctx.font =
					"16px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
				ctx.textAlign = "center"
				ctx.textBaseline = "top"
				ctx.fillText(titleText, centerX, qrY + qrSize + 12)

				// Date under title
				if (dateText) {
					ctx.fillStyle = "#555555"
					ctx.font =
						"13px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
					ctx.fillText(dateText, centerX, qrY + qrSize + 32)
				}

				const dataUrl = exportCanvas.toDataURL("image/png")

				const now = new Date()
				const pad = (n) => String(n).padStart(2, "0")
				const slug = makeSlug(lastPath || lastUrl || "qr")
				const fileName = `qr-${slug}-${now.getFullYear()}${pad(
					now.getMonth() + 1
				)}${pad(now.getDate())}-${pad(now.getHours())}${pad(
					now.getMinutes()
				)}.png`

				const a = document.createElement("a")
				a.href = dataUrl
				a.download = fileName
				document.body.appendChild(a)
				a.click()
				document.body.removeChild(a)
			}

			downloadBtn.addEventListener("click", downloadPng)
		</script>
	</body>
</html>
