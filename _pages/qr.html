<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>QR Generator – Image Links</title>
		<style>
			body {
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					sans-serif;
				max-width: 600px;
				margin: 40px auto;
				padding: 0 16px;
			}
			label,
			input,
			button {
				font-size: 16px;
			}
			input {
				width: 100%;
				padding: 8px;
				margin: 8px 0 12px;
			}
			button {
				padding: 8px 16px;
				cursor: pointer;
				margin-right: 8px;
			}
			#qrcode {
				margin-top: 24px;
				text-align: center;
			}
			#finalUrl,
			#generatedDate {
				margin-top: 12px;
				font-size: 14px;
				text-align: center;
				word-break: break-all;
			}
			#generatedDate {
				font-size: 12px;
				color: #555;
				margin-top: 6px;
			}

			/* Print Mode */
			@media print {
				body {
					margin: 0;
					padding: 20px;
				}
				h1,
				p,
				label,
				input,
				button {
					display: none !important;
				}
				#qrcode,
				#finalUrl,
				#generatedDate {
					display: block !important;
					text-align: center;
				}
			}
		</style>
	</head>
	<body>
		<h1>QR Generator</h1>
		<p>
			Enter the image file name or path (e.g.
			<code>assets/new/nexus.jpg</code>)
		</p>

		<label for="pathInput">Path / file name</label>
		<input
			id="pathInput"
			placeholder="assets/new/nexus.jpg"
		/>

		<button id="generateBtn">Generate QR</button>
		<button id="printBtn">Print</button>
		<button id="downloadBtn">Download PNG</button>

		<div id="finalUrl"></div>
		<div id="generatedDate"></div>
		<div id="qrcode"></div>

		<!-- Hidden canvas used for exporting QR + date as an image -->
		<canvas
			id="exportCanvas"
			style="display: none"
		></canvas>

		<!-- QR library -->
		<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
		<script>
			/* WRITE YOUR OWN DOMAIN HERE */
			const BASE_URL = "https://www.next52books.com/"

			const input = document.getElementById("pathInput")
			const btn = document.getElementById("generateBtn")
			const printBtn = document.getElementById("printBtn")
			const downloadBtn = document.getElementById("downloadBtn")
			const finalUrlEl = document.getElementById("finalUrl")
			const dateEl = document.getElementById("generatedDate")
			const qrContainer = document.getElementById("qrcode")
			const exportCanvas = document.getElementById("exportCanvas")

			let qr

			function createOrUpdateQR(text) {
				if (!qr) {
					qr = new QRCode(qrContainer, {
						text,
						width: 256,
						height: 256,
					})
				} else {
					qr.clear()
					qr.makeCode(text)
				}
			}

			function getEnglishDate() {
				const now = new Date()
				const opts = {
					year: "numeric",
					month: "short",
					day: "numeric",
					hour: "2-digit",
					minute: "2-digit",
				}
				return now.toLocaleString("en-US", opts)
			}

			btn.addEventListener("click", () => {
				const path = input.value.trim()
				if (!path) {
					alert("Please enter a path or file name first.")
					return
				}

				const url =
					BASE_URL.replace(/\/+$/, "") + "/" + path.replace(/^\/+/, "")
				finalUrlEl.textContent = "URL: " + url

				createOrUpdateQR(url)

				// Add timestamp
				dateEl.textContent = "Generated on: " + getEnglishDate()
			})

			printBtn.addEventListener("click", () => {
				if (!finalUrlEl.textContent) {
					alert("Generate a QR code first.")
					return
				}
				window.print()
			})

			function downloadPng() {
				if (!finalUrlEl.textContent) {
					alert("Generate a QR code first.")
					return
				}

				// Try to find the QR image/canvas generated by qrcodejs
				const img = qrContainer.querySelector("img")
				const qrCanvas = qrContainer.querySelector("canvas")
				const sourceEl = img || qrCanvas

				if (!sourceEl) {
					alert("QR code image is not ready yet.")
					return
				}

				const qrSize = sourceEl.naturalWidth || sourceEl.width || 256
				const padding = 16
				const lineHeight = 18
				const dateText = dateEl.textContent || ""

				const extraHeight = dateText ? padding + lineHeight + 4 : 0
				const exportWidth = qrSize + padding * 2
				const exportHeight = qrSize + padding * 2 + extraHeight

				exportCanvas.width = exportWidth
				exportCanvas.height = exportHeight

				const ctx = exportCanvas.getContext("2d")

				// White background
				ctx.fillStyle = "#ffffff"
				ctx.fillRect(0, 0, exportWidth, exportHeight)

				// Draw QR centered
				const qrX = (exportWidth - qrSize) / 2
				const qrY = padding
				ctx.drawImage(sourceEl, qrX, qrY, qrSize, qrSize)

				// Draw date text under QR
				if (dateText) {
					ctx.fillStyle = "#555555"
					ctx.font =
						"14px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
					ctx.textAlign = "center"
					ctx.textBaseline = "top"
					const textY = qrY + qrSize + padding
					ctx.fillText(dateText, exportWidth / 2, textY)
				}

				const dataUrl = exportCanvas.toDataURL("image/png")

				// Trigger download
				const a = document.createElement("a")
				const now = new Date()
				const pad = (n) => String(n).padStart(2, "0")
				const fileName = `qr-${now.getFullYear()}${pad(
					now.getMonth() + 1
				)}${pad(now.getDate())}-${pad(now.getHours())}${pad(
					now.getMinutes()
				)}.png`

				a.href = dataUrl
				a.download = fileName
				document.body.appendChild(a)
				a.click()
				document.body.removeChild(a)
			}

			downloadBtn.addEventListener("click", downloadPng)
		</script>
	</body>
</html>
