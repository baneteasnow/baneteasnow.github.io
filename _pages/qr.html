<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="UTF-8" />
		<title>QR Generator – Image Links</title>
		<style>
			body {
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					sans-serif;
				max-width: 600px;
				margin: 40px auto;
				padding: 0 16px;
			}
			label,
			input,
			button {
				font-size: 16px;
			}
			input {
				width: 100%;
				padding: 8px;
				margin: 8px 0 12px;
			}
			button {
				padding: 8px 16px;
				cursor: pointer;
			}
			#qrcode {
				margin-top: 24px;
			}
			#finalUrl {
				margin-top: 12px;
				font-size: 14px;
				word-break: break-all;
			}
		</style>
	</head>
	<body>
		<h1>QR Generator</h1>
		<p>
			Resim dosya adını veya yolunu yaz: (ör. <code>img/harari-nexus.jpg</code>)
		</p>

		<label for="pathInput">Path / file name</label>
		<input
			id="pathInput"
			placeholder="img/harari-nexus.jpg"
		/>

		<button id="generateBtn">QR üret</button>

		<div id="finalUrl"></div>
		<div id="qrcode"></div>

		<!-- Basit bir QR kütüphanesi (qrcodejs) -->
		<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
		<script>
			// KENDİ DOMAINİNİ BURAYA YAZ
			const BASE_URL = "https://www.next52books.com/"

			const input = document.getElementById("pathInput")
			const btn = document.getElementById("generateBtn")
			const finalUrlEl = document.getElementById("finalUrl")
			const qrContainer = document.getElementById("qrcode")

			let qr

			function createOrUpdateQR(text) {
				// İlk seferde yarat, sonrasında içeriğini güncelle
				if (!qr) {
					qr = new QRCode(qrContainer, {
						text,
						width: 256,
						height: 256,
					})
				} else {
					qr.clear()
					qr.makeCode(text)
				}
			}

			btn.addEventListener("click", () => {
				const path = input.value.trim()
				if (!path) {
					alert("Önce bir path / dosya adı yaz.")
					return
				}

				// Çift slash olmasın diye ufak temizlik
				const url =
					BASE_URL.replace(/\/+$/, "") + "/" + path.replace(/^\/+/, "")

				finalUrlEl.textContent = "URL: " + url
				createOrUpdateQR(url)
			})
		</script>
	</body>
</html>
