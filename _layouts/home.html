layout: default

<header>
	<p class="post-meta home-post-date">
		<a class="home-ideas-link" href="{{ '/ideas/' | relative_url }}">ideas</a>
		<a href="#links"
			><time datetime="{{ site.posts.first.date | date: '%Y-%m-%d' }}"
				>{{ site.posts.first.date | date: "%B %-d, %Y" }}</time
			></a
		>
	</p>
</header>
<style>
	.home-post-date {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
		gap: 1em;
		text-align: right;
		color: #666;
		font-family: "EB Garamond", Georgia, serif;
		font-size: 15px !important;
		font-weight: 400;
		font-style: normal;
		line-height: 1.35;
		margin-bottom: 24px;
	}
.home-post-date a,
.home-post-date a time {
  color: inherit;
  font-family: "EB Garamond", Georgia, serif !important;
  font-size: 15px !important;
  font-weight: 400 !important;
  font-style: normal;
  text-decoration: none;
}
	.home-post-date a:hover,
	.home-post-date a:focus-visible {
		text-decoration: underline;
		text-underline-offset: 3px;
	}
	/* Soft underline highlight for the homepage now · more · search links only. */
	#links.link1 a {
		background-image: linear-gradient(0deg, #e8e4df, #e8e4df);
	}
	.home-post-date a.home-ideas-link {
  font-size: 15px !important;
	font-style: italic;
	font-weight: 400;
}
</style>
