<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}">
  {%- include head.html -%}
  <body a="{{ site.theme_config.appearance | default: "auto" }}">
    <main class="page-content" aria-label="Content">
      <div class="w">
        {{ content }}
            {% include site-footer.html %}

      </div>
    </main>

    <nav class="side-links" aria-label="Quick navigation">
      <a href="#" class="back-to-top-link" aria-label="Back to top"><span class="desktop-top-label">Back to top ↑</span><span class="mobile-top-label">↑ Top</span></a>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/posts.html' | relative_url }}">All Posts</a>
      <a href="{{ '/search.html' | relative_url }}">Search</a>
      <a href="{{ '/list' | relative_url }}">Tools</a>
      <a href="{{ '/map' | relative_url }}">More</a>
      <a href="https://homelibrary.next52books.com/browse/">homelibrary</a>
    </nav>

    <style>
      .side-links {
        position: fixed;
        right: 3%;
        top: 55%;
        display: flex;
        flex-direction: column;
        gap: 5px;
        z-index: 10;
        font-family: 'EB Garamond', Georgia, serif;
        font-size: 14px;
        font-style: italic;
        line-height: 1.4;
      }
      .side-links a { color: #999; text-decoration: none; }
      .side-links .mobile-top-label { display: none; }
      .side-links a:hover, .side-links a:focus-visible { color: #555; text-decoration: underline; text-underline-offset: 3px; }
      /* On narrow screens, keep navigation visible without covering the reading column. */
      @media (max-width: 900px) {
        .side-links .desktop-top-label { display: none; }
        .side-links .mobile-top-label { display: inline; }
        .side-links {
          top: auto;
          right: 0;
          bottom: 0;
          left: 0;
          flex-direction: row;
          justify-content: space-evenly;
          align-items: center;
          flex-wrap: wrap;
          gap: 0 8px;
          padding: 8px 10px calc(20px + env(safe-area-inset-bottom));
          background: rgba(242, 242, 242, 0.93);
          -webkit-backdrop-filter: blur(8px);
          backdrop-filter: blur(8px);
          border-top: 1px solid rgba(0, 0, 0, 0.06);
        }
        .side-links a {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-height: 44px;
          white-space: nowrap;
          color: #555;
        }
        .page-content { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
      }
    </style>

    {%-if site.goat_counter and jekyll.environment == "production"-%}
      {%-include goat_counter.html-%}
    {%-endif-%}
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker
      .register('/sw.js')
      .then(function() {
        console.log("Service Worker Registered");
      });
  } else {
    console.log('error register service worker')
  }
</script>
  </body>
</html>
