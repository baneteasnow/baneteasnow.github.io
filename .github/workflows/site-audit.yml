name: Jekyll Site Auditor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - run: python scripts/jekyll-audit.py --output "$RUNNER_TEMP/jekyll-audit"
      - uses: actions/upload-artifact@v4
        with:
          name: jekyll-audit
          path: ${{ runner.temp }}/jekyll-audit
