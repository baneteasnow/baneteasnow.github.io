---
layout: default
title: Categories
published: true
permalink: /category.html
---
<section class="category-archive" aria-label="Books by category">
  <h1 id="categoryName">Categories</h1>
  <p id="categoryCount" class="category-count"></p>
  <div id="categoryBooks" aria-live="polite"></div>
</section>
<style>
.category-archive{max-width:760px;margin:0 auto}
.category-archive h1{font-size:21px;font-weight:600;margin-bottom:8px;overflow-wrap:anywhere}
.category-count{font-size:13px;color:#777;margin-bottom:26px}
.category-book{padding:13px 0;border-bottom:1px solid #e8e8e8}
.category-book-title{display:block;color:#222;font-size:14px;font-weight:600;text-decoration:none}
.category-book-title:hover{text-decoration:underline}
.category-book-turkish{font-size:13px;color:#777;margin-top:3px}
.category-book-author{font-size:13px;color:#666;margin-top:4px}
.category-book-author a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.category-book-date{font-size:12px;color:#888;margin-top:5px}
.category-index{list-style:none;margin:0;padding:0}
.category-index li{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #e8e8e8}
.category-index a{color:inherit;text-decoration:underline;text-decoration-color:#bbb;text-underline-offset:3px;overflow-wrap:anywhere}
.category-index a:hover{text-decoration-color:currentColor}
.category-index .number{color:#888;font-size:12px;white-space:nowrap}
</style>
<script>
(function(){
  'use strict';
  const tag=(new URLSearchParams(location.search).get('tag')||'').trim();
  const name=document.getElementById('categoryName');
  const count=document.getElementById('categoryCount');
  const list=document.getElementById('categoryBooks');
  name.textContent=tag||'Categories';
  count.textContent='Loading...';
  function formatDate(value){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return value||'';
    const [y,m,d]=value.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }
  function addBook(b){
    const row=document.createElement('div');row.className='category-book';
    const title=document.createElement('a');title.className='category-book-title';
    title.href=b.url;title.textContent=b.book||b.title||'';row.appendChild(title);
    if(b.turkish&&b.turkish!=='-'){
      const tr=document.createElement('div');tr.className='category-book-turkish';tr.textContent=b.turkish;row.appendChild(tr);
    }
    if(b.author){
      const author=document.createElement('div');author.className='category-book-author';
      String(b.author).split(/\s*,\s*/).filter(Boolean).forEach((a,i)=>{
        if(i)author.appendChild(document.createTextNode(', '));
        const link=document.createElement('a');
        link.href="{{ '/author.html' | relative_url }}?name="+encodeURIComponent(a);
        link.textContent=a;author.appendChild(link);
      });row.appendChild(author);
    }
    if(b.date){const date=document.createElement('div');date.className='category-book-date';date.textContent=formatDate(b.date);row.appendChild(date);}
    list.appendChild(row);
  }
  fetch("{{ '/search.json' | relative_url }}")
    .then(r=>{if(!r.ok)throw Error('Unable to load books');return r.json();})
    .then(books=>{
      if(!Array.isArray(books))throw Error('Unexpected data format');
      if(!tag){
        const totals=new Map();
        books.forEach(b=>{
          const tags=Array.isArray(b.tag)?b.tag:[b.tag];
          tags.forEach(t=>{t=String(t||'').trim();if(t)totals.set(t,(totals.get(t)||0)+1);});
        });
        const categories=[...totals].sort((a,b)=>a[0].localeCompare(b[0],'en',{sensitivity:'base'}));
        count.textContent=categories.length+(categories.length===1?' category':' categories');
        const ul=document.createElement('ul');ul.className='category-index';
        categories.forEach(([category,total])=>{
          const li=document.createElement('li');
          const a=document.createElement('a');a.href="{{ '/category.html' | relative_url }}?tag="+encodeURIComponent(category);a.textContent=category;
          const n=document.createElement('span');n.className='number';n.textContent=total+(total===1?' book':' books');
          li.append(a,n);ul.appendChild(li);
        });
        list.appendChild(ul);
        return;
      }
      const matches=books.filter(b=>(Array.isArray(b.tag)?b.tag:[b.tag]).some(t=>String(t||'').trim()===tag))
        .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
      count.textContent=matches.length+(matches.length===1?' book':' books');
      if(!matches.length){list.textContent='No books found in this category.';return;}
      matches.forEach(addBook);
    })
    .catch(e=>{console.error(e);count.textContent='Unable to load books.';});
})();
</script>
